<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" fill="none">
  <defs>
    <radialGradient id="apiGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="120" y1="45" x2="240" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#17263c"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
    <linearGradient id="shieldRim" x1="120" y1="45" x2="240" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <circle cx="180" cy="130" r="115" fill="url(#apiGlow)"/>

  <!-- Outer API Node Connections -->
  <g stroke="#60a5fa" stroke-opacity="0.4" stroke-width="2">
    <line x1="126" y1="88" x2="86" y2="68"/>
    <line x1="234" y1="88" x2="274" y2="68"/>
    <line x1="126" y1="164" x2="84" y2="182"/>
    <line x1="234" y1="164" x2="276" y2="182"/>
  </g>
  <circle cx="84" cy="67" r="6" fill="#38bdf8"/>
  <circle cx="276" cy="67" r="6" fill="#34d399"/>
  <circle cx="82" cy="183" r="6" fill="#34d399"/>
  <circle cx="278" cy="183" r="6" fill="#38bdf8"/>

  <!-- Central Health/API Shield -->
  <path d="M180 44L244 68V124C244 166.5 216.8 202.4 180 216C143.2 202.4 116 166.5 116 124V68L180 44Z" fill="url(#shieldGrad)" stroke="url(#shieldRim)" stroke-width="3.5"/>

  <!-- API Tag Pill -->
  <rect x="148" y="68" width="64" height="24" rx="12" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="180" y="84" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="13" font-weight="800" fill="#93c5fd" letter-spacing="1.5">REST</text>

  <!-- Epidemiology Analytics Bars -->
  <rect x="144" y="138" width="12" height="32" rx="4" fill="#38bdf8" opacity="0.75"/>
  <rect x="164" y="122" width="12" height="48" rx="4" fill="#60a5fa"/>
  <rect x="184" y="130" width="12" height="40" rx="4" fill="#34d399"/>
  <rect x="204" y="110" width="12" height="60" rx="4" fill="#10b981"/>

  <!-- Trend Line Over Bars -->
  <path d="M142 130L166 112L186 120L214 96" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="214" cy="96" r="4.5" fill="#34d399" stroke="#ffffff" stroke-width="1.5"/>
</svg>
